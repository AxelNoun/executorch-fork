# Construit le harnais iPhone (audit_22513/ios) en .ipa NON SIGNÉ sur un runner macOS, à signer et
# installer depuis Windows avec Sideloadly (audit_22513/ios/README-ios.md). Indépendant des mesures.
name: audit-22513-ios-ipa

on:
  push:
    branches: ["audit/22513-*"]
    paths:
      - "audit_22513/ios/**"
      - ".github/workflows/audit-22513-ios-ipa.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: audit_22513/ios
    steps:
      - uses: actions/checkout@v4

      - name: Outils
        run: |
          set -eux
          xcodebuild -version
          brew install xcodegen
          xcodegen version

      # Ressources : tiny bf16 du rapporteur (public) + exports à entrée fp32 de la dernière mesure
      # (artefact device-ptes du workflow audit-22513-macos), s'ils existent.
      - name: Ressources (.pte)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -ux
          mkdir -p Resources /tmp/device
          curl -sL -o Resources/whisper_tiny_mlx_bf16.pte "https://huggingface.co/software-mansion/react-native-executorch-whisper-tiny/resolve/v0.10.0/mlx/whisper_tiny_mlx_bf16.pte"
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow audit-22513-macos.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'device-ptes-*' -D /tmp/device || true
            find /tmp/device -name '*.pte' -exec cp {} Resources/ \; || true
          fi
          ls -la Resources
          shasum -a 256 Resources/*.pte

      - name: Projet Xcode
        run: |
          set -eux
          xcodegen generate
          xcodebuild -resolvePackageDependencies -project MemProbe.xcodeproj -scheme MemProbe

      - name: Build (non signé)
        run: |
          set -eux
          xcodebuild -project MemProbe.xcodeproj -scheme MemProbe -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning: .*MemProbe|BUILD|Compiling|Linking" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log
          APP=dd/Build/Products/Release-iphoneos/MemProbe.app
          ls -la "$APP"
          ls "$APP" | grep -i "pte\|bundle\|metallib" || true
          find "$APP" -name "*.metallib" -o -name "*.bundle" | head
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/ && zip -qr MemProbe.ipa Payload
          ls -la MemProbe.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MemProbe-ipa-${{ github.run_number }}
          path: |
            audit_22513/ios/MemProbe.ipa
            audit_22513/ios/xcodebuild.log
          if-no-files-found: warn
