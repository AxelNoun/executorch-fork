# Expériences macOS de AUDIT_22513.md (§ 5 : E1, E3, E6, E7, E8, E9) sur un runner
# GitHub Actions Apple Silicon. À copier dans .github/workflows/ d'une branche du fork
# qui contient audit_22513/ (patches + ci/), puis « Run workflow ».
#
# Ce que ça mesure et ce que ça ne mesure pas :
# - le runner est une VM : Metal expose « Apple Paravirtual device » (MLX le gère,
#   mlx/backend/metal/allocator.cpp:66-70). Les mécanismes (RSS vs footprint,
#   règles de coupe, variables MLX_*) sont testables ; les valeurs absolues d'un
#   iPhone, non. E3/E4 sur l'appareil restent au rapporteur.
# - runner standard `macos-26` : 3 vCPU / 7 Go RAM (gratuit pour un dépôt public).
#   `macos-26-xlarge` (payant) si l'export whisper-small fusionné manque de RAM.
# - ExecuTorch et MLX exécutent déjà leurs tests Metal sur ces runners
#   (.github/workflows/mlx.yml, ml-explore/mlx build_and_test.yml).
name: audit-22513-macos

on:
  workflow_dispatch:
    inputs:
      pte_url:
        description: ".pte non fusionné à mesurer (fichier public du rapporteur)"
        default: "https://huggingface.co/software-mansion/react-native-executorch-whisper-small/resolve/v0.10.0/mlx/whisper_small_mlx_int8.pte"
      tiny_url:
        description: ".pte tiny bf16 non fusionné (comparaison E3 avec l'export fusionné du dépôt)"
        default: "https://huggingface.co/software-mansion/react-native-executorch-whisper-tiny/resolve/v0.10.0/mlx/whisper_tiny_mlx_bf16.pte"
      export_fused_model:
        description: "modèle HF à exporter fusionné avec export_whisper.py (E3) ; vide = sauter"
        default: "openai/whisper-tiny"
      runner:
        description: "macos-26 (standard, gratuit) ou macos-26-xlarge"
        default: "macos-26"

jobs:
  measure:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patches d'instrumentation (P1 footprint, P3 constantes copiées)
        run: |
          set -eux
          for p in P1-executor-runner-phys-footprint.diff P3-log-constants-copied-by-mlx.diff; do
            if git apply --check "audit_22513/patches/$p"; then
              git apply "audit_22513/patches/$p"
            elif git apply --check -R "audit_22513/patches/$p"; then
              echo "$p déjà appliqué sur cette branche"
            else
              echo "$p ne s'applique pas sur cette révision"; exit 1
            fi
          done

      - name: Machine et device Metal
        run: |
          set -eux
          sw_vers
          sysctl hw.memsize hw.ncpu hw.pagesize
          system_profiler SPDisplaysDataType | head -30
          xcrun -sdk macosx --find metal

      # Même séquence que test-mlx-whisper dans mlx.yml : install_executorch.py construit les
      # pybindings avec MLX (tools/cmake/preset/pybind.cmake : ON si `xcrun -sdk macosx --find metal`).
      - name: Install ExecuTorch (pybindings avec MLX)
        run: |
          set -eux
          python install_executorch.py

      # ET_MIN_LOG_LEVEL=Info : le preset mlx-release met Error, ce qui compilerait les
      # ET_LOG(Info) de P1/P3 hors du binaire.
      - name: Build executor_runner avec le délégué MLX
        run: |
          set -eux
          cmake --preset mlx-release -DEXECUTORCH_BUILD_EXECUTOR_RUNNER=ON -DET_MIN_LOG_LEVEL=Info
          cmake --build cmake-out --target executor_runner -j"$(sysctl -n hw.ncpu)"
          ls -la cmake-out/executor_runner
          ls cmake-out/backends/mlx/mlx/mlx/backend/metal/kernels/mlx.metallib

      - name: Télécharger les .pte du rapporteur
        run: |
          set -eux
          curl -sL -o small.pte "${{ inputs.pte_url }}"
          curl -sL -o tiny.pte "${{ inputs.tiny_url }}"
          shasum -a 256 small.pte tiny.pte

      # E1 : RSS vs footprint sur le harnais de l'issue. /usr/bin/time -l imprime
      # « maximum resident set size » et « peak memory footprint » ; P1 ajoute
      # lifetime_max_phys_footprint après load_method et après la boucle.
      - name: E1 — encode et decode, RSS vs footprint
        run: |
          set -eux
          for m in encode decode; do
            /usr/bin/time -l ./cmake-out/executor_runner --model_path small.pte --method_name "$m" --num_executions 5 2>&1 | tee "e1_small_$m.txt"
          done
          /usr/bin/time -l ./cmake-out/executor_runner --model_path tiny.pte --method_name encode --num_executions 5 2>&1 | tee e1_tiny_encode.txt

      # E6 : seuils iPhone ('p' : 20 dispatches) émulés ; attendu : inchangé (la règle de
      # taille domine pour ce graphe).
      - name: E6 — MLX_MAX_OPS_PER_BUFFER=20
        run: |
          MLX_MAX_OPS_PER_BUFFER=20 /usr/bin/time -l ./cmake-out/executor_runner --model_path small.pte --method_name encode --num_executions 5 2>&1 | tee e6_small_encode.txt

      # E7 : fenêtre réduite par la règle de taille ; attendu : inchangé sur le graphe
      # non fusionné (chaque op de scores est déjà seule), forte baisse sur le fusionné.
      - name: E7 — MLX_MAX_MB_PER_BUFFER=10
        run: |
          MLX_MAX_MB_PER_BUFFER=10 /usr/bin/time -l ./cmake-out/executor_runner --model_path small.pte --method_name encode --num_executions 5 2>&1 | tee e7_small_encode.txt
          MLX_MAX_MB_PER_BUFFER=10 /usr/bin/time -l ./cmake-out/executor_runner --model_path tiny.pte --method_name encode --num_executions 5 2>&1 | tee e7_tiny_encode.txt

      # E8 : les deux loaders sur le même fichier. executor_runner = FileDataLoader
      # (déjà couvert par les logs P3 ci-dessus) ; executorch.runtime = MmapDataLoader
      # + mlock ignore errors (extension/pybindings/pybindings.cpp:190-191).
      - name: E8 — mmap+mlock via les pybindings
        continue-on-error: true
        run: |
          set -eux
          python audit_22513/ci/e8_mmap_runtime.py small.pte encode 2>&1 | tee e8_small_encode_mmap.txt
          python audit_22513/ci/e8_mmap_runtime.py tiny.pte encode 2>&1 | tee e8_tiny_encode_mmap.txt

      # E3 côté macOS : export fusionné par le pipeline du dépôt (SdpaNode) et comparaison
      # avec le fichier non fusionné de même taille. openai/whisper-* ne demande pas de token.
      - name: E3 — export fusionné avec export_whisper.py
        if: inputs.export_fused_model != ''
        continue-on-error: true
        run: |
          set -eux
          export HF_HUB_DISABLE_XET=1
          pip install -U "huggingface_hub[cli]<1.0"   # comme test-mlx-whisper dans mlx.yml
          pip install transformers soundfile datasets librosa
          python -m executorch.backends.mlx.examples.whisper.export_whisper \
            --model-id "${{ inputs.export_fused_model }}" --output-dir /tmp/fused --dtype bf16
          ls -la /tmp/fused
          /usr/bin/time -l ./cmake-out/executor_runner --model_path /tmp/fused/encoder.pte --num_executions 5 2>&1 | tee e3_fused_encoder.txt
          MLX_MAX_MB_PER_BUFFER=10 /usr/bin/time -l ./cmake-out/executor_runner --model_path /tmp/fused/encoder.pte --num_executions 5 2>&1 | tee e7_fused_encoder.txt
          MLX_MAX_OPS_PER_BUFFER=20 /usr/bin/time -l ./cmake-out/executor_runner --model_path /tmp/fused/encoder.pte --num_executions 5 2>&1 | tee e6_fused_encoder.txt
          # comptage des nœuds d'attention (E2 côté runner) ; non bloquant si l'inspecteur manque des fichiers générés
          set +e
          python -m executorch.backends.mlx.pte_inspector /tmp/fused/encoder.pte --mlx-instructions > e3_fused_encoder.instr.txt 2> e3_inspector.err
          python -m executorch.backends.mlx.pte_inspector tiny.pte --mlx-instructions > e3_tiny_reporter.instr.txt 2>> e3_inspector.err
          echo "fused encoder: SdpaNode=$(grep -c SdpaNode e3_fused_encoder.instr.txt) SoftmaxNode=$(grep -c SoftmaxNode e3_fused_encoder.instr.txt)" | tee e2_counts.txt
          echo "reporter tiny (2 delegates): SdpaNode=$(grep -c SdpaNode e3_tiny_reporter.instr.txt) SoftmaxNode=$(grep -c SoftmaxNode e3_tiny_reporter.instr.txt)" | tee -a e2_counts.txt
          tail -3 e3_inspector.err || true
          set -e

      # E9 : contrainte d'alignement (pointeur) et de longueur de newBufferWithBytesNoCopy.
      - name: E9 — newBufferWithBytesNoCopy
        run: |
          set -eux
          clang++ -std=c++17 -ObjC++ -fobjc-arc -framework Metal -framework Foundation audit_22513/ci/e9_nocopy.mm -o e9
          ./e9 2>&1 | tee e9.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-22513-macos-${{ inputs.runner }}
          path: |
            e*.txt
